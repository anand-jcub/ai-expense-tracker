# Fly.io deploy — run .\deploy.ps1 from an interactive terminal (browser login).
# Remote builder: no local Docker required.

app = "expense-tracker-anand"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  DATA_DIR = "/data"
  ENV = "production"
  COOKIE_SECURE = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# Created by deploy.ps1: fly volumes create expensedata --region sin --size 1
[[mounts]]
  source = "expensedata"
  destination = "/data"
