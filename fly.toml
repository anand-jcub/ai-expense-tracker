# Fly.io Phase 0 config (install flyctl, then: fly launch --no-deploy && fly volumes create … && fly deploy)
# Docs: docs/deploy.md

app = "expense-tracker-anand"  # change if taken
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  DATA_DIR = "/data"
  ENV = "production"
  COOKIE_SECURE = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# Uncomment after: fly volumes create expensedata --region sin --size 1
# [[mounts]]
#   source = "expensedata"
#   destination = "/data"
